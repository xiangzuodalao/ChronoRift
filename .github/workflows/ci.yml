name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm check

  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .tools/godot/4.7.1
          key: godot-4.7.1-linux-x86_64-c7ff14fd
      - run: corepack pnpm godot:install
      - run: corepack pnpm godot:doctor
      - run: corepack pnpm test:godot

  sandbox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap busybox-static ripgrep
      - name: Configure ephemeral runner user namespaces
        run: |
          sudo sysctl --write kernel.unprivileged_userns_clone=1
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run required sandbox conformance
        run: |
          sudo systemd-run --quiet --wait --pipe --collect \
            --unit="chronorift-sandbox-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --property=Delegate=yes \
            --property=User="$(id -un)" \
            --property=WorkingDirectory="${GITHUB_WORKSPACE}" \
            --setenv=PATH="${PATH}" \
            --setenv=HOME="${HOME}" \
            /bin/bash .github/scripts/run-sandbox-conformance.sh

  vnext-godot-sandbox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap busybox-static fontconfig ripgrep xdg-user-dirs
      - uses: actions/cache@v4
        with:
          path: .tools/godot/4.7.1
          key: godot-4.7.1-linux-x86_64-c7ff14fd
      - run: corepack pnpm godot:install
      - name: Stage immutable managed runtime executables
        run: |
          set -euo pipefail
          node_source="$(realpath -e "$(command -v node)")"
          godot_source="$(realpath -e .tools/godot/4.7.1/Godot_v4.7.1-stable_linux.x86_64)"
          sudo install -d -o root -g root -m 0755 /usr/lib/chronorift-ci/bin
          sudo install -o root -g root -m 0755 "${node_source}" /usr/lib/chronorift-ci/bin/node-22.23.1
          sudo install -o root -g root -m 0755 "${godot_source}" /usr/lib/chronorift-ci/bin/godot-4.7.1
          test "$(stat -c '%u:%g:%a' /usr/lib/chronorift-ci/bin/node-22.23.1)" = "0:0:755"
          test "$(stat -c '%u:%g:%a' /usr/lib/chronorift-ci/bin/godot-4.7.1)" = "0:0:755"
          test "$(/usr/lib/chronorift-ci/bin/node-22.23.1 --version)" = "v22.23.1"
          /usr/lib/chronorift-ci/bin/godot-4.7.1 --version | grep -E '^4\.7\.1\.stable\.official\.[a-f0-9]{7,64}$'
      - name: Configure ephemeral runner user namespaces
        run: |
          sudo sysctl --write kernel.unprivileged_userns_clone=1
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run required vNext Godot sandbox conformance
        run: |
          set -euo pipefail
          storage_root="/mnt/chronorift-m3-storage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_storage() {
            main_status="$?"
            cleanup_status=0
            trap - EXIT
            set +e
            if mountpoint -q "${storage_root}"; then
              if ! sudo umount "${storage_root}"; then
                echo "failed to unmount bounded M3 Task storage: ${storage_root}" >&2
                cleanup_status=1
              fi
            fi
            if ! sudo rmdir "${storage_root}"; then
              echo "failed to remove bounded M3 Task storage mountpoint: ${storage_root}" >&2
              cleanup_status=1
            fi
            if ((main_status != 0)); then
              exit "${main_status}"
            fi
            exit "${cleanup_status}"
          }
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 "${storage_root}"
          trap cleanup_storage EXIT
          sudo mount -t tmpfs \
            -o "size=1G,nr_inodes=131072,mode=0700,uid=$(id -u),gid=$(id -g)" \
            chronorift-m3-task-storage "${storage_root}"
          sudo systemd-run --quiet --wait --pipe --collect \
            --unit="chronorift-vnext-godot-sandbox-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --property=Delegate=yes \
            --property=User="$(id -un)" \
            --property=WorkingDirectory="${GITHUB_WORKSPACE}" \
            --setenv=PATH="${PATH}" \
            --setenv=HOME="${HOME}" \
            --setenv=GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            --setenv=CHRONORIFT_NODE_BIN=/usr/lib/chronorift-ci/bin/node-22.23.1 \
            --setenv=GODOT_BIN=/usr/lib/chronorift-ci/bin/godot-4.7.1 \
            --setenv=CHRONORIFT_GODOT_ADDON_ROOT="${GITHUB_WORKSPACE}/godot/addons/chronorift" \
            --setenv=CHRONORIFT_TEST_NODE_BIN=/usr/lib/chronorift-ci/bin/node-22.23.1 \
            --setenv=CHRONORIFT_TEST_GODOT_BIN=/usr/lib/chronorift-ci/bin/godot-4.7.1 \
            --setenv=CHRONORIFT_TEST_GODOT_ADDON_ROOT="${GITHUB_WORKSPACE}/godot/addons/chronorift" \
            --setenv=CHRONORIFT_TEST_TASK_STORAGE_ROOT="${storage_root}" \
            --setenv=CHRONORIFT_TEST_BWRAP_BIN=/usr/bin/bwrap \
            --setenv=CHRONORIFT_TEST_PRLIMIT_BIN=/usr/bin/prlimit \
            --setenv=CHRONORIFT_TEST_BUSYBOX_BIN=/usr/bin/busybox \
            --setenv=CHRONORIFT_TEST_LDD_BIN=/usr/bin/ldd \
            --setenv=CHRONORIFT_TEST_FONTCONFIG_PROBE_BIN=/usr/bin/fc-match \
            --setenv=CHRONORIFT_TEST_XDG_USER_DIR_BIN=/usr/bin/xdg-user-dir \
            --setenv=CHRONORIFT_TEST_BASH_BIN=/usr/bin/bash \
            --setenv=CHRONORIFT_TEST_RG_BIN=/usr/bin/rg \
            --setenv=CHRONORIFT_TEST_FIND_BIN=/usr/bin/find \
            --setenv=CHRONORIFT_TEST_LS_BIN=/usr/bin/ls \
            /bin/bash .github/scripts/run-vnext-godot-sandbox-conformance.sh

  vnext-external-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap busybox-static fontconfig ripgrep xdg-user-dirs
      - uses: actions/cache@v4
        with:
          path: .tools/godot/4.7.1
          key: godot-4.7.1-linux-x86_64-c7ff14fd
      - run: corepack pnpm godot:install
      - name: Stage immutable managed runtime executables
        run: |
          set -euo pipefail
          node_source="$(realpath -e "$(command -v node)")"
          godot_source="$(realpath -e .tools/godot/4.7.1/Godot_v4.7.1-stable_linux.x86_64)"
          sudo install -d -o root -g root -m 0755 /usr/lib/chronorift-ci/bin
          sudo install -o root -g root -m 0755 "${node_source}" /usr/lib/chronorift-ci/bin/node-22.23.1
          sudo install -o root -g root -m 0755 "${godot_source}" /usr/lib/chronorift-ci/bin/godot-4.7.1
          test "$(stat -c '%u:%g:%a' /usr/lib/chronorift-ci/bin/node-22.23.1)" = "0:0:755"
          test "$(stat -c '%u:%g:%a' /usr/lib/chronorift-ci/bin/godot-4.7.1)" = "0:0:755"
          test "$(/usr/lib/chronorift-ci/bin/node-22.23.1 --version)" = "v22.23.1"
          test "$(/usr/lib/chronorift-ci/bin/godot-4.7.1 --version)" = "4.7.1.stable.official.a13da4feb"
      - name: Provision frozen external project checkout
        env:
          FROZEN_COMMIT: 3e793f53598a131c53fb82555191cc14b8db07ff
          FROZEN_TREE: a013bd677c712dbf354e8e2f6e8ff7c53d5684c6
        run: |
          set -euo pipefail
          external_project_root="${RUNNER_TEMP}/chronorift-m4-external-project-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "${external_project_root}"
          install -d -m 0700 "${external_project_root}"
          cleanup_failed_provision() {
            provision_status="$?"
            trap - EXIT
            if ((provision_status != 0)); then
              case "${external_project_root}" in
                "${RUNNER_TEMP}"/chronorift-m4-external-project-*)
                  rm -rf -- "${external_project_root}"
                  ;;
                *)
                  echo "refusing failed-provision cleanup for unexpected path: ${external_project_root}" >&2
                  ;;
              esac
            fi
            exit "${provision_status}"
          }
          trap cleanup_failed_provision EXIT
          git -C "${external_project_root}" init --quiet --initial-branch=main
          GIT_TERMINAL_PROMPT=0 git -C "${external_project_root}" \
            -c protocol.version=2 \
            -c protocol.file.allow=never \
            fetch --quiet --no-tags --depth=1 \
            https://github.com/endlessm/moddable-platformer.git "${FROZEN_COMMIT}"
          git -C "${external_project_root}" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "${external_project_root}" rev-parse HEAD)" = "${FROZEN_COMMIT}"
          test "$(git -C "${external_project_root}" rev-parse 'HEAD^{tree}')" = "${FROZEN_TREE}"
          test -z "$(git -C "${external_project_root}" status --porcelain=v1 --untracked-files=all --ignored=matching)"
          printf 'CHRONORIFT_CI_EXTERNAL_PROJECT_ROOT=%s\n' "${external_project_root}" >>"${GITHUB_ENV}"
          trap - EXIT
      - name: Configure ephemeral runner user namespaces
        run: |
          sudo sysctl --write kernel.unprivileged_userns_clone=1
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run required M4 external-project conformance offline
        run: |
          set -euo pipefail
          storage_root="/mnt/chronorift-m4-storage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          evidence_output="${RUNNER_TEMP}/chronorift-m4-external-project-evidence.json"
          semantic_evidence_output="${RUNNER_TEMP}/chronorift-e2-external-semantic-evidence.json"
          cleanup_storage() {
            main_status="$?"
            cleanup_status=0
            trap - EXIT
            set +e
            if mountpoint -q "${storage_root}"; then
              if ! sudo umount "${storage_root}"; then
                echo "failed to unmount bounded M4 Task storage: ${storage_root}" >&2
                cleanup_status=1
              fi
            fi
            if ! sudo rmdir "${storage_root}"; then
              echo "failed to remove bounded M4 Task storage mountpoint: ${storage_root}" >&2
              cleanup_status=1
            fi
            if ((main_status != 0)); then
              exit "${main_status}"
            fi
            exit "${cleanup_status}"
          }
          test ! -e "${evidence_output}"
          test ! -e "${semantic_evidence_output}"
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 "${storage_root}"
          trap cleanup_storage EXIT
          sudo mount -t tmpfs \
            -o "size=1G,nr_inodes=131072,mode=0700,uid=$(id -u),gid=$(id -g)" \
            chronorift-m4-task-storage "${storage_root}"
          sudo systemd-run --quiet --wait --pipe --collect \
            --unit="chronorift-vnext-external-project-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --property=Delegate=yes \
            --property=PrivateNetwork=yes \
            --property=User="$(id -un)" \
            --property=WorkingDirectory="${GITHUB_WORKSPACE}" \
            --setenv=PATH="${PATH}" \
            --setenv=HOME="${HOME}" \
            --setenv=RUNNER_TEMP="${RUNNER_TEMP}" \
            --setenv=GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            --setenv=CHRONORIFT_NODE_BIN=/usr/lib/chronorift-ci/bin/node-22.23.1 \
            --setenv=GODOT_BIN=/usr/lib/chronorift-ci/bin/godot-4.7.1 \
            --setenv=CHRONORIFT_GODOT_LIFECYCLE_ADDON_ROOT="${GITHUB_WORKSPACE}/godot/addons/chronorift_lifecycle" \
            --setenv=CHRONORIFT_GODOT_SEMANTIC_ADDON_ROOT="${GITHUB_WORKSPACE}/godot/addons/chronorift_semantic" \
            --setenv=CHRONORIFT_TEST_NODE_BIN=/usr/lib/chronorift-ci/bin/node-22.23.1 \
            --setenv=CHRONORIFT_TEST_GODOT_BIN=/usr/lib/chronorift-ci/bin/godot-4.7.1 \
            --setenv=CHRONORIFT_TEST_GODOT_LIFECYCLE_ADDON_ROOT="${GITHUB_WORKSPACE}/godot/addons/chronorift_lifecycle" \
            --setenv=CHRONORIFT_TEST_GODOT_SEMANTIC_ADDON_ROOT="${GITHUB_WORKSPACE}/godot/addons/chronorift_semantic" \
            --setenv=CHRONORIFT_TEST_TASK_STORAGE_ROOT="${storage_root}" \
            --setenv=CHRONORIFT_TEST_BWRAP_BIN=/usr/bin/bwrap \
            --setenv=CHRONORIFT_TEST_PRLIMIT_BIN=/usr/bin/prlimit \
            --setenv=CHRONORIFT_TEST_BUSYBOX_BIN=/usr/bin/busybox \
            --setenv=CHRONORIFT_TEST_LDD_BIN=/usr/bin/ldd \
            --setenv=CHRONORIFT_TEST_FONTCONFIG_PROBE_BIN=/usr/bin/fc-match \
            --setenv=CHRONORIFT_TEST_XDG_USER_DIR_BIN=/usr/bin/xdg-user-dir \
            --setenv=CHRONORIFT_TEST_BASH_BIN=/usr/bin/bash \
            --setenv=CHRONORIFT_TEST_RG_BIN=/usr/bin/rg \
            --setenv=CHRONORIFT_TEST_FIND_BIN=/usr/bin/find \
            --setenv=CHRONORIFT_TEST_LS_BIN=/usr/bin/ls \
            --setenv=CHRONORIFT_TEST_EXTERNAL_PROJECT_ROOT="${CHRONORIFT_CI_EXTERNAL_PROJECT_ROOT}" \
            --setenv=CHRONORIFT_TEST_EXTERNAL_PROJECT_DESCRIPTOR="${GITHUB_WORKSPACE}/testdata/vnext/external-project/moddable-platformer.project.v1.json" \
            --setenv=CHRONORIFT_TEST_EXTERNAL_SEMANTIC_ADAPTER_PROFILE="${GITHUB_WORKSPACE}/testdata/vnext/external-project/moddable-platformer.semantic-adapter.v1.json" \
            --setenv=CHRONORIFT_TEST_EXTERNAL_PROJECT_CONFORMANCE_SPEC="${GITHUB_WORKSPACE}/testdata/vnext/external-project/moddable-platformer.conformance.v1.json" \
            --setenv=CHRONORIFT_TEST_EXTERNAL_PROJECT_EVIDENCE_SCHEMA="${GITHUB_WORKSPACE}/testdata/vnext/external-project/evidence-summary.schema.v1.json" \
            --setenv=CHRONORIFT_TEST_EVIDENCE_OUTPUT="${evidence_output}" \
            --setenv=CHRONORIFT_TEST_SEMANTIC_EVIDENCE_OUTPUT="${semantic_evidence_output}" \
            /bin/bash .github/scripts/run-vnext-external-project-conformance.sh
      - name: Upload sanitized M4 and E2 conformance evidence
        uses: actions/upload-artifact@v4
        with:
          name: chronorift-external-project-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chronorift-m4-external-project-evidence.json
            ${{ runner.temp }}/chronorift-e2-external-semantic-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove frozen external project checkout
        if: always()
        run: |
          set -euo pipefail
          external_project_root="${CHRONORIFT_CI_EXTERNAL_PROJECT_ROOT:-}"
          if [[ -z "${external_project_root}" ]]; then
            exit 0
          fi
          case "${external_project_root}" in
            "${RUNNER_TEMP}"/chronorift-m4-external-project-*) ;;
            *)
              echo "refusing to remove unexpected external project path: ${external_project_root}" >&2
              exit 1
              ;;
          esac
          rm -rf -- "${external_project_root}"
