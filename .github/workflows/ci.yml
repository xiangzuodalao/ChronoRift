name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm check

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep fontconfig xdg-user-dirs
      - uses: actions/cache@v4
        with:
          path: .tools/godot/4.7.1
          key: godot-4.7.1-linux-x86_64-c7ff14fd
      - run: corepack pnpm godot:install
      - run: corepack pnpm godot:doctor
      - name: Configure ephemeral runner user namespaces
        run: |
          sudo sysctl --write kernel.unprivileged_userns_clone=1
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - run: corepack pnpm test:godot
      - name: Run SRT 0.0.74 coding and Godot conformance
        run: .github/scripts/run-srt-sandbox-conformance.sh
