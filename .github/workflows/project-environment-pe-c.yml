name: Project Environment PE-C

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap busybox-static fontconfig ripgrep xdg-user-dirs
      - uses: actions/cache@v4
        with:
          path: .tools/godot/4.7.1
          key: godot-4.7.1-linux-x86_64-c7ff14fd
      - run: corepack pnpm godot:install
      - name: Stage immutable Host executables
        run: |
          set -euo pipefail
          node_source="$(realpath -e "$(command -v node)")"
          godot_source="$(realpath -e .tools/godot/4.7.1/Godot_v4.7.1-stable_linux.x86_64)"
          sudo install -d -o root -g root -m 0755 /usr/lib/chronorift-pe-c-ci/bin
          sudo install -o root -g root -m 0755 "${node_source}" /usr/lib/chronorift-pe-c-ci/bin/node-22.23.1
          sudo install -o root -g root -m 0755 "${godot_source}" /usr/lib/chronorift-pe-c-ci/bin/godot-4.7.1
          test "$(stat -c '%u:%g:%a' /usr/lib/chronorift-pe-c-ci/bin/node-22.23.1)" = "0:0:755"
          test "$(stat -c '%u:%g:%a' /usr/lib/chronorift-pe-c-ci/bin/godot-4.7.1)" = "0:0:755"
          test "$(/usr/lib/chronorift-pe-c-ci/bin/node-22.23.1 --version)" = "v22.23.1"
          test "$(/usr/lib/chronorift-pe-c-ci/bin/godot-4.7.1 --version)" = "4.7.1.stable.official.a13da4feb"
      - name: Provision frozen external project checkout
        env:
          FROZEN_COMMIT: 3e793f53598a131c53fb82555191cc14b8db07ff
          FROZEN_TREE: a013bd677c712dbf354e8e2f6e8ff7c53d5684c6
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          external_project_root="${RUNNER_TEMP}/chronorift-pe-c-external-project-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "${external_project_root}"
          install -d -m 0700 "${external_project_root}"
          cleanup_failed_provision() {
            provision_status="$?"
            trap - EXIT
            if ((provision_status != 0)); then
              case "${external_project_root}" in
                "${RUNNER_TEMP}"/chronorift-pe-c-external-project-*)
                  rm -rf -- "${external_project_root}"
                  ;;
                *)
                  echo "refusing failed-provision cleanup for unexpected path: ${external_project_root}" >&2
                  ;;
              esac
            fi
            exit "${provision_status}"
          }
          trap cleanup_failed_provision EXIT
          git -C "${external_project_root}" init --quiet --initial-branch=main
          GIT_TERMINAL_PROMPT=0 git -C "${external_project_root}" \
            -c protocol.version=2 \
            -c protocol.file.allow=never \
            fetch --quiet --no-tags --depth=1 \
            https://github.com/endlessm/moddable-platformer.git "${FROZEN_COMMIT}"
          git -C "${external_project_root}" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "${external_project_root}" rev-parse HEAD)" = "${FROZEN_COMMIT}"
          test "$(git -C "${external_project_root}" rev-parse 'HEAD^{tree}')" = "${FROZEN_TREE}"
          test -z "$(git -C "${external_project_root}" status --porcelain=v1 --untracked-files=all --ignored=matching)"
          printf 'CHRONORIFT_CI_PE_C_EXTERNAL_PROJECT_ROOT=%s\n' "${external_project_root}" >>"${GITHUB_ENV}"
          trap - EXIT
      - name: Configure ephemeral runner user namespaces
        run: |
          sudo sysctl --write kernel.unprivileged_userns_clone=1
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run PE-C external-project conformance offline
        run: |
          set -euo pipefail
          storage_root="/mnt/chronorift-pe-c-storage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_storage() {
            main_status="$?"
            cleanup_status=0
            trap - EXIT
            set +e
            if mountpoint -q "${storage_root}"; then
              if ! sudo umount "${storage_root}"; then
                echo "failed to unmount bounded PE-C Task storage: ${storage_root}" >&2
                cleanup_status=1
              fi
            fi
            if ! sudo rmdir "${storage_root}"; then
              echo "failed to remove bounded PE-C Task storage mountpoint: ${storage_root}" >&2
              cleanup_status=1
            fi
            if ((main_status != 0)); then
              exit "${main_status}"
            fi
            exit "${cleanup_status}"
          }
          test ! -e "${storage_root}"
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 "${storage_root}"
          trap cleanup_storage EXIT
          sudo mount -t tmpfs \
            -o "size=1G,nr_inodes=131072,mode=0700,uid=$(id -u),gid=$(id -g)" \
            chronorift-pe-c-task-storage "${storage_root}"
          sudo systemd-run --quiet --wait --pipe --collect \
            --unit="chronorift-project-environment-pe-c-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --property=Delegate=yes \
            --property=PrivateNetwork=yes \
            --property=User="$(id -un)" \
            --property=WorkingDirectory="${GITHUB_WORKSPACE}" \
            --setenv=PATH="${PATH}" \
            --setenv=HOME="${HOME}" \
            --setenv=RUNNER_TEMP="${RUNNER_TEMP}" \
            --setenv=GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            --setenv=CHRONORIFT_NODE_BIN=/usr/lib/chronorift-pe-c-ci/bin/node-22.23.1 \
            --setenv=GODOT_BIN=/usr/lib/chronorift-pe-c-ci/bin/godot-4.7.1 \
            --setenv=CHRONORIFT_TEST_NODE_BIN=/usr/lib/chronorift-pe-c-ci/bin/node-22.23.1 \
            --setenv=CHRONORIFT_TEST_GODOT_BIN=/usr/lib/chronorift-pe-c-ci/bin/godot-4.7.1 \
            --setenv=CHRONORIFT_TEST_TASK_STORAGE_ROOT="${storage_root}" \
            --setenv=CHRONORIFT_TEST_BWRAP_BIN=/usr/bin/bwrap \
            --setenv=CHRONORIFT_TEST_PRLIMIT_BIN=/usr/bin/prlimit \
            --setenv=CHRONORIFT_TEST_BUSYBOX_BIN=/usr/bin/busybox \
            --setenv=CHRONORIFT_TEST_LDD_BIN=/usr/bin/ldd \
            --setenv=CHRONORIFT_TEST_FONTCONFIG_PROBE_BIN=/usr/bin/fc-match \
            --setenv=CHRONORIFT_TEST_XDG_USER_DIR_BIN=/usr/bin/xdg-user-dir \
            --setenv=CHRONORIFT_TEST_BASH_BIN=/usr/bin/bash \
            --setenv=CHRONORIFT_TEST_RG_BIN=/usr/bin/rg \
            --setenv=CHRONORIFT_TEST_FIND_BIN=/usr/bin/find \
            --setenv=CHRONORIFT_TEST_LS_BIN=/usr/bin/ls \
            --setenv=CHRONORIFT_TEST_PE_C_EXTERNAL_PROJECT_ROOT="${CHRONORIFT_CI_PE_C_EXTERNAL_PROJECT_ROOT}" \
            /bin/bash .github/scripts/run-vnext-project-environment-pe-c-conformance.sh
      - name: Remove frozen external project checkout
        if: always()
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          external_project_root="${CHRONORIFT_CI_PE_C_EXTERNAL_PROJECT_ROOT:-}"
          if [[ -z "${external_project_root}" ]]; then
            exit 0
          fi
          case "${external_project_root}" in
            "${RUNNER_TEMP}"/chronorift-pe-c-external-project-*) ;;
            *)
              echo "refusing to remove unexpected external project path: ${external_project_root}" >&2
              exit 1
              ;;
          esac
          test "$(git -C "${external_project_root}" rev-parse HEAD)" = "3e793f53598a131c53fb82555191cc14b8db07ff"
          test "$(git -C "${external_project_root}" rev-parse 'HEAD^{tree}')" = "a013bd677c712dbf354e8e2f6e8ff7c53d5684c6"
          test -z "$(git -C "${external_project_root}" status --porcelain=v1 --untracked-files=all --ignored=matching)"
          rm -rf -- "${external_project_root}"
