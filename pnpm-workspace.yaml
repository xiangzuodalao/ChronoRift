packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@google/genai": false
  esbuild: true
  protobufjs: false
minimumReleaseAgeExclude:
  - "@typescript-eslint/eslint-plugin@8.66.0"
  - "@typescript-eslint/parser@8.66.0"
  - "@typescript-eslint/project-service@8.66.0"
  - "@typescript-eslint/scope-manager@8.66.0"
  - "@typescript-eslint/tsconfig-utils@8.66.0"
  - "@typescript-eslint/type-utils@8.66.0"
  - "@typescript-eslint/types@8.66.0"
  - "@typescript-eslint/typescript-estree@8.66.0"
  - "@typescript-eslint/utils@8.66.0"
  - "@typescript-eslint/visitor-keys@8.66.0"
  - typescript-eslint@8.66.0
  - "@anthropic-ai/sandbox-runtime@0.0.74"
# Keep Pi's transitive runtime on the same reviewed release as the public SDK.
overrides:
  "@earendil-works/pi-agent-core": "0.84.1"
  "@earendil-works/pi-ai": "0.84.1"
  "@earendil-works/pi-tui": "0.84.1"
  "@earendil-works/pi-client": "0.84.1"
  "@earendil-works/pi-protocol": "0.84.1"
  "@earendil-works/pi-telemetry": "0.84.1"
